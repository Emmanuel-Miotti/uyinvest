spring:
  application:
    name: uyinvest-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/uyinvest}
    username: ${DB_USERNAME:uyinvest}
    password: ${DB_PASSWORD:uyinvest}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-every-other-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

market-data:
  provider: ${MARKET_DATA_PROVIDER:mock}
  base-url: ${MARKET_DATA_BASE_URL:https://finnhub.io/api/v1}
  api-key: ${MARKET_DATA_API_KEY:}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
