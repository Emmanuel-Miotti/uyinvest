spring:
  application:
    name: uyinvest-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uyinvest}
    username: ${DB_USERNAME:uyinvest}
    password: ${DB_PASSWORD:uyinvest}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-every-other-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
