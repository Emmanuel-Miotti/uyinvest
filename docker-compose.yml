services:
  postgres:
    image: postgres:16-alpine
    container_name: uyinvest-postgres
    environment:
      POSTGRES_DB: uyinvest
      POSTGRES_USER: uyinvest
      POSTGRES_PASSWORD: uyinvest
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - uyinvest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uyinvest"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: uyinvest-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/uyinvest
      DB_USERNAME: uyinvest
      DB_PASSWORD: uyinvest
      JWT_SECRET: ${JWT_SECRET:-docker-compose-dev-secret-change-me-please-override-in-real-deployments}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MARKET_DATA_PROVIDER: mock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: uyinvest-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uyinvest_postgres_data:
